<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme o seu e-mail</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <img src="{{ .SiteURL }}/brand/toptap-logo.png" alt="TopTap" height="32" style="display:block;height:32px;border:0;" />
                <h1 style="margin:28px 0 12px;font-size:22px;line-height:1.3;font-weight:700;">Confirme o seu e-mail</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3f3f46;">
                  Toque no botão abaixo para confirmar este e-mail e entrar na sua conta TopTap.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:8px;background:#1a73e8;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">Confirmar meu e-mail</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#71717a;">
                  O link vale por 1 hora e só pode ser usado uma vez.
                </p>
                <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#71717a;">
                  Não pediu este e-mail? É só ignorar: nada muda na sua conta.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa;">TopTap · Mais avaliações no Google para o seu negócio</p>
        </td>
      </tr>
    </table>
  </body>
</html>
