<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código de verificação</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <img src="{{ .SiteURL }}/brand/toptap-logo.png" alt="TopTap" height="32" style="display:block;height:32px;border:0;" />
                <h1 style="margin:28px 0 12px;font-size:22px;line-height:1.3;font-weight:700;">Seu código de verificação</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3f3f46;">
                  Use o código abaixo para confirmar que é você na TopTap.
                </p>
                <p style="margin:0 0 24px;font-size:32px;line-height:1;font-weight:700;letter-spacing:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{ .Token }}</p>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#71717a;">
                  O código vale por 1 hora.
                </p>
                <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#71717a;">
                  Não pediu este código? É só ignorar: ninguém altera a sua conta sem ele.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa;">TopTap · Mais avaliações no Google para o seu negócio</p>
        </td>
      </tr>
    </table>
  </body>
</html>
